<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fc" />
    <meta name="description" content="小卡 - AI智能体开发与AIGC实战应用，项目作品集与服务展示。" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>小卡 - AI实战项目集</title>
    <script>
      // GitHub Pages SPA shim - read the redirected path written by 404.html and rewrite history.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f7fc;gap:16px;">
        <div style="width:36px;height:36px;border:3px solid #cbd5e1;border-top-color:#0891b2;border-radius:50%;animation:app-spin 0.8s linear infinite;"></div>
        <p style="color:#475569;font-size:14px;font-family:system-ui,-apple-system,sans-serif;">加载中…</p>
      </div>
      <style>#app-loading{opacity:1;transition:opacity 0.3s}@keyframes app-spin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
